<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">MiWu conceptual architecture</title><desc id="desc">Separate real Shopify serving and offline million-corpus evaluation tracks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#748469"/></marker></defs><rect width="1120" height="670" rx="22" fill="#faf9f5"/><g font-family="Arial, sans-serif" fill="#30362e"><text x="38" y="48" font-size="25" font-weight="700">MiWu · Real commerce data, evidence-grounded guidance</text><text x="38" y="78" font-size="14" fill="#70776b">Conceptual responsibilities · implementation and operating configuration remain private</text><text x="38" y="128" font-size="14" font-weight="700">REAL SHOPIFY MVP · SMALL TEST CATALOG</text><rect x="38" y="150" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="54" y="181" font-size="16" font-weight="600">Shopper + sidebar</text><text x="54" y="207" font-size="12" fill="#6c7465">English UI · bilingual input</text><rect x="318" y="150" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="334" y="181" font-size="16" font-weight="600">Signed App Proxy</text><text x="334" y="207" font-size="12" fill="#6c7465">Same-store request boundary</text><rect x="598" y="150" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="614" y="181" font-size="16" font-weight="600">FastAPI + commerce core</text><text x="614" y="207" font-size="12" fill="#6c7465">Validated Agent tools</text><rect x="878" y="150" width="204" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="894" y="181" font-size="16" font-weight="600">Evidence checks</text><text x="894" y="207" font-size="12" fill="#6c7465">Verified storefront cards</text><line x1="282" y1="193" x2="314" y2="193" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><line x1="562" y1="193" x2="594" y2="193" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><line x1="842" y1="193" x2="874" y2="193" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><rect x="318" y="275" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="334" y="306" font-size="16" font-weight="600">Shopify GraphQL</text><text x="334" y="332" font-size="12" fill="#6c7465">Product sync and adapter</text><rect x="598" y="275" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="614" y="306" font-size="16" font-weight="600">Unified product catalog</text><text x="614" y="332" font-size="12" fill="#6c7465">Retrieval and reranking</text><line x1="562" y1="318" x2="592" y2="318" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><line x1="720" y1="275" x2="720" y2="241" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="408" font-size="14" font-weight="700">OFFLINE FOUNDATION · 1,002,822 PASSAGES / 1,000 DEV QUERIES</text><rect x="38" y="433" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="54" y="464" font-size="16" font-weight="600">Multi-CPR E-commerce</text><text x="54" y="490" font-size="12" fill="#6c7465">Dataset labels for evaluation</text><rect x="318" y="433" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="334" y="464" font-size="16" font-weight="600">Sparse + dense retrieval</text><text x="334" y="490" font-size="12" fill="#6c7465">Memory-aware local vectors</text><rect x="598" y="433" width="244" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="614" y="464" font-size="16" font-weight="600">Hybrid + reranker</text><text x="614" y="490" font-size="12" fill="#6c7465">Bounded candidate reranking</text><rect x="878" y="433" width="204" height="85" rx="12" fill="white" stroke="#d7ddcf"/><text x="894" y="464" font-size="16" font-weight="600">Layered evaluation</text><text x="894" y="490" font-size="12" fill="#6c7465">Retrieval · Intent · RAG · Agent</text><line x1="282" y1="476" x2="314" y2="476" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><line x1="562" y1="476" x2="594" y2="476" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><line x1="842" y1="476" x2="874" y2="476" stroke="#748469" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="554" width="1044" height="76" rx="12" fill="#edf0e5"/><text x="56" y="583" font-size="14" font-weight="600">Shared architecture, distinct evidence</text><text x="56" y="606" font-size="13">Offline ranking metrics do not establish million-product cloud serving or production conversion gains.</text></g></svg>
